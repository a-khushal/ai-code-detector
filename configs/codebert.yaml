seed: 42

model:
  name: microsoft/codebert-base
  max_length: 256
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 2.0e-5
  num_train_epochs: 2
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  fp16: true
  max_train_samples: 50000  # set null for full train set
  logging_steps: 100
  eval_steps: 500
  save_total_limit: 1

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  model_dir: models/codebert
